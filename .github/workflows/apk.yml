name: 建兩個 APK 並發成 Release

# 手動觸發為主 —— APK 幾乎建一次就定了，日常改測項走 pages.yml 就好。
#
# 為什麼一定要發成 Release 而不是留 artifact：
# GitHub Actions 的 artifact 下載連結需要登入 GitHub 才能取用，
# 把連結丟給對方，對方點開只會看到登入頁。public repo 的 release asset
# 是公開直連，點了就下載。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # 建 Release 需要

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shell-capacitor 是 Gradle 8.11.1 + AGP 8.7.2，需要 JDK 21。
      # shell-geckoview 刻意對齊同一組版本，所以一個 JDK 就夠。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shell-capacitor/package-lock.json

      # 兩個殼的 compileSdk 不同：Capacitor 殼是 35（AGP 8.7.2 的上限），
      # GeckoView 殼是 36（它的依賴鏈要求）。
      #
      # 用這個 action 而不是直接呼叫 sdkmanager：runner 雖然預裝了 Android SDK，
      # 但 cmdline-tools 不在 PATH，直接跑會是 command not found（實測過）。
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 platforms;android-36 build-tools;35.0.0'

      # 順序很重要：先注入時間戳，再產生離線複本，
      # 這樣線上版與離線版帶的是同一個 build 標記。
      - name: 注入 build 時間戳
        run: |
          STAMP=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')
          echo "BUILD_STAMP=$STAMP" >> "$GITHUB_ENV"
          sed -i "s/__BUILD__/$STAMP/g" web/*.html
          if grep -q '__BUILD__' web/*.html; then
            echo "::error::還有 __BUILD__ 沒被替換"; exit 1
          fi

      - name: 產生離線 fallback
        run: ./scripts/sync-offline.sh

      - name: 建 Capacitor 殼（系統 WebView）
        working-directory: shell-capacitor
        run: |
          npm ci
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 這裡原本有一步「確認 NDK 存在」，因為 AGP 會抱怨
      # "Unable to strip ... libxul.so"，看起來像缺 NDK 導致 APK 肥大。
      # 那是誤判：runner 本來就有 NDK，加了也一樣抱怨 ——
      # 那些 .so 本身早就 stripped，沒有 debug symbols 可剝。
      # 真正的原因是 .so 沒被壓縮，已改用 useLegacyPackaging 解決
      # （見 shell-geckoview/app/build.gradle），278MB → 141MB。
      - name: 建 GeckoView 殼（自帶引擎）
        working-directory: shell-geckoview
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          # strip 有沒有生效直接看得出來，別讓 278MB 的版本悄悄發出去
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # 檔名刻意用英文：中文檔名經過 Release 的 URL 編碼後，
      # 在某些 Android 下載器上會變成亂碼或直接失敗。
      # 哪一個是哪一個，寫在 Release 說明裡。
      - name: 整理 APK
        run: |
          mkdir -p dist
          cp shell-capacitor/android/app/build/outputs/apk/debug/app-debug.apk \
             dist/css-test-system-webview.apk
          cp shell-geckoview/app/build/outputs/apk/debug/app-debug.apk \
             dist/css-test-bundled-gecko.apk
          ls -lh dist/
          # 把實際大小寫進 Release 說明，對方才知道要準備多少流量
          {
            echo "SIZE_SYSTEM=$(du -h dist/css-test-system-webview.apk | cut -f1)"
            echo "SIZE_GECKO=$(du -h dist/css-test-bundled-gecko.apk | cut -f1)"
          } >> "$GITHUB_ENV"

      - name: 發 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: CSS 支援度測試 ${{ env.BUILD_STAMP }}
          files: dist/*.apk
          body: |
            ## 請幫忙測這兩個 app

            **兩個都要裝**，各截一組圖。這兩個 app 顯示的內容完全一樣，
            差別只在「用什麼瀏覽器引擎去畫」—— 我們要比較的就是這件事。

            | 檔案 | 裝起來的名字 | 大小 | 說明 |
            |---|---|---|---|
            | `css-test-system-webview.apk` | **CSS測試 系統版** | ${{ env.SIZE_SYSTEM }} | 用手機內建的瀏覽器元件 |
            | `css-test-bundled-gecko.apk` | **CSS測試 自帶版** | ${{ env.SIZE_GECKO }} | 自己帶一份瀏覽器引擎，所以檔案大得多，建議連 Wi-Fi 下載 |

            ### 步驟

            1. 兩個 APK 都下載並安裝。安裝時若出現「不允許安裝未知來源的應用」，請在提示裡開啟允許。
            2. 打開 **CSS測試 系統版**，照畫面上的指示，**每頁截一張圖**（請用手機的「捲動截圖／長截圖」功能把整頁截下來），共 6 張。
            3. 打開 **CSS測試 自帶版**，同樣截 6 張。
            4. 12 張一起傳回來就可以了。

            ### 兩點提醒

            - 如果覺得畫面是舊的，把 app 關掉重開一次。每頁最下面有一行 `build` 時間，對一下是不是這一版：`${{ env.BUILD_STAMP }}`
            - 大部分測項是左右並排，只要看**左右長得一不一樣**，不需要懂 CSS。少數幾項會特別說明怎麼看。
